# =============================================================================
# Fluxer Desktop Client — Windows Build + Velopack Publish
#
# LOCATION: This file lives in the IaC repo at ci/github/build-desktop-windows.yaml.
#           Copy it to the fork at .github/workflows/build-desktop-windows.yaml.
#
# WHAT IT DOES (two jobs):
#   build:
#     1. Checks out the Fluxer fork at a specific upstream commit SHA.
#     2. Builds the Electron desktop client with the windows-game-capture variant.
#     3. Uploads the unpacked Electron app as a workflow artifact.
#
#   package-publish:
#     4. Downloads the build artifact.
#     5. Packs the build output into a Velopack release (vpk pack).
#     6. Authenticates to GCP via Workload Identity Federation (no JSON keys).
#     7. Uploads the Velopack release to the GCS download bucket at the correct
#        feed path so the client's built-in auto-updater can consume it.
#     8. Attaches the Velopack installer as a workflow artifact for first-time installs.
#     9. Prunes old releases, keeping only current + previous.
#
# WHY TWO JOBS:
#   The build takes ~30 minutes (checkout, Rust compile, electron-builder).
#   Packaging and upload take ~2 minutes. Every packaging bug was forcing a
#   full recompile. With two jobs, a packaging failure can be retried with
#   `gh run rerun --job <package-publish-job-id>` in 2 minutes, not 30.
#
# WHY workflow_dispatch WITH A COMMIT SHA:
#   The desktop client is hard-coupled to the app-proxy image via bridgeVersion.
#   A mismatch is a fatal crash at startup. By requiring the same commit SHA
#   that was used for the Cloud Build image pipeline, we guarantee the client
#   and server are built from the same source. This eliminates the bridge
#   version coupling that has caused repeated fatal client crashes.
#
# PREREQUISITES:
#   - The GCS bucket "nka-fluxer-desktop" must exist (created by Pulumi).
#   - The fork must have UPDATE_API_ENDPOINT patched to
#     https://storage.googleapis.com/nka-fluxer-desktop
#   - Workload Identity Federation must be configured (created by Pulumi).
#
# VELOPACK FEED PATH:
#   The client constructs its update URL as:
#     ${UPDATE_API_ENDPOINT}/dl/desktop/${BUILD_CHANNEL}/${process.platform}/${DESKTOP_DOWNLOAD_ARCH}/${DESKTOP_BUILD_VARIANT}
#   For our build: dl/desktop/canary/win32/x64/windows-game-capture/
#   The Velopack releases.win.json, .nupkg packages, and Setup go under this prefix.
#
# VELOPACK OUTPUT FILENAMES:
#   When no --channel is specified, Velopack defaults to the OS name ("win").
#   The channel is embedded in filenames:
#     {packId}-{ver}-full.nupkg          — update package (versioned, immutable)
#     {packId}-{channel}-Setup.exe       — installer (overwritten each build)
#     {packId}-{channel}-Portable.zip    — portable zip (overwritten each build)
#     releases.{channel}.json            — modern feed for UpdateManager
#     assets.{channel}.json              — build manifest (not needed for updates)
#     RELEASES                           — legacy feed for Squirrel migration
#   We do NOT hardcode exact filenames — we glob for *Setup.exe, *Portable.zip,
#   and *.nupkg, asserting exactly the expected count. This has been more
#   reliable than guessing Velopack's naming conventions.
# =============================================================================

name: Build Desktop Client (Windows)

on:
  workflow_dispatch:
    inputs:
      upstream_commit_sha:
        description: >
          Full 40-character SHA from fluxerapp/fluxer to build.
          Must match the commit used for the Cloud Build image pipeline.
        required: true
        type: string
      fork_ref:
        description: "Branch or tag of THIS fork to build (carries our patches). Normally 'main'."
        required: true
        default: main
      build_version:
        description: >
          Version string for the build (e.g. "2026.802.120000").
          Used as PUBLIC_BUILD_VERSION and the Velopack package version.
        required: true
        type: string

# Workflow-level permissions. Each job narrows further via job-level permissions.
permissions:
  contents: read

# Only one desktop build at a time — a concurrent upload could corrupt
# the feed by interleaving files from two releases.
concurrency:
  group: desktop-build
  cancel-in-progress: false

env:
  # --- Build configuration ---
  BUILD_CHANNEL: canary
  PUBLIC_RELEASE_CHANNEL: canary
  FLUXER_DESKTOP_BUILD_VARIANT: windows-game-capture
  DESKTOP_DOWNLOAD_ARCH: x64
  PLATFORM: win32

  # --- Velopack pack ID ---
  # MUST match WINDOWS_VELOPACK_ID in src/common/DesktopIdentity.ts.
  # The client's UpdateManager matches releases by this ID, and Velopack
  # installs to %LocalAppData%\{packId}. Changing it silently breaks
  # updates for every installed client.
  #   canary → fluxer_desktop_canary
  #   stable → fluxer_desktop
  VELOPACK_PACK_ID: fluxer_desktop_canary

  # --- GCP configuration ---
  # These must match the Pulumi stack outputs.
  GCS_BUCKET: nka-fluxer-desktop
  WIF_PROVIDER: projects/502629968490/locations/global/workloadIdentityPools/fluxer-desktop-ci/providers/github-actions
  SERVICE_ACCOUNT: fluxer-desktop-ci@devops-sandbox-nka.iam.gserviceaccount.com

  # --- Feed path ---
  # Matches the client's URL construction:
  #   ${UPDATE_API_ENDPOINT}/dl/desktop/${BUILD_CHANNEL}/${PLATFORM}/${ARCH}/${VARIANT}/
  FEED_PREFIX: dl/desktop/canary/win32/x64/windows-game-capture

jobs:
  # ===================================================================
  # JOB 1: BUILD
  # Checkout, verify ancestry, install toolchains, build, electron-builder.
  # Uploads the unpacked Electron app as a workflow artifact so the
  # package-publish job can consume it without rebuilding.
  # ~30 minutes. Only re-run if the source code changed.
  # ===================================================================
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      # =====================================================================
      # 1. Checkout THIS fork's branch (which carries our patches) and then
      #    assert that it is based on the requested upstream commit.
      #
      #    Checking out `inputs.upstream_commit_sha` directly would be wrong:
      #    that SHA is upstream's commit, which by definition does NOT contain
      #    our fork patches (they are a later commit). The build would silently
      #    produce a client pointing at web.canary.fluxer.app and at Fluxer's
      #    update API instead of our instance and our bucket.
      #
      #    Instead we build the fork ref and verify its ancestry, so a mismatch
      #    fails loudly rather than shipping a wrongly-configured client.
      # =====================================================================
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_ref }}
          fetch-depth: 0

      - name: Verify fork is based on the requested upstream commit
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/fluxerapp/fluxer.git
          git fetch --no-tags upstream "${{ inputs.upstream_commit_sha }}"
          if ! git merge-base --is-ancestor "${{ inputs.upstream_commit_sha }}" HEAD; then
            echo "::error::HEAD is not a descendant of ${{ inputs.upstream_commit_sha }}."
            echo "::error::Server images and client must come from the same upstream base"
            echo "::error::or the voice-engine bridge versions can diverge and the client"
            echo "::error::will crash fatally at startup."
            exit 1
          fi
          echo "OK: $(git rev-parse HEAD) descends from ${{ inputs.upstream_commit_sha }}"

      # =====================================================================
      # 2. Setup Node.js 24
      #    Their CI uses Node 24. Node 25 dropped corepack, so we install
      #    pnpm manually via npm.
      # =====================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.29.3

      # =====================================================================
      # 3. Setup Rust with both x86_64 and i686 MSVC targets
      #    The windows-game-capture variant needs 32-bit artifacts even for
      #    an x64 build (the game capture hook DLL must be 32-bit to inject
      #    into 32-bit games).
      # =====================================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      # =====================================================================
      # 4. Install dependencies
      # =====================================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =====================================================================
      # 5. Build the application
      #    We run the two commands that dev:desktop:package would have run,
      #    because the fluxer-dev crate does not compile on Windows
      #    (tools/dev/src/tunnel.rs:372 uses std::os::unix::net without
      #    a #[cfg(unix)] guard).
      # =====================================================================
      - name: Build application
        env:
          PUBLIC_BUILD_VERSION: ${{ inputs.build_version }}
        # working-directory is mandatory. At the monorepo root the "build"
        # script is `cargo run -p fluxer-dev -- build`, and fluxer-dev does
        # NOT compile on Windows. Inside fluxer_desktop, "build" is
        # `node scripts/build.mjs`, which is what we want.
        working-directory: fluxer_desktop
        run: |
          pnpm build
          pnpm exec electron-builder --dir --config electron-builder.config.cjs

      # =====================================================================
      # 6. Upload the unpacked Electron app as a workflow artifact.
      #    The package-publish job downloads this and feeds it to vpk pack.
      #
      #    upload-artifact@v4 compresses by default (zlib). The unpacked app
      #    is ~300-500 MB; compression helps transfer speed between jobs.
      #
      #    Permission bits: upload-artifact does NOT preserve Unix permission
      #    bits. This is irrelevant here — we are on Windows (NTFS) and the
      #    consumer is also Windows.
      #
      #    retention-days: 1 — this artifact is only needed for the
      #    package-publish job in the same run. Short retention prevents
      #    accumulation of ~300 MB artifacts.
      # =====================================================================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: electron-win-unpacked
          path: fluxer_desktop/dist-electron/win-unpacked/
          retention-days: 1
          if-no-files-found: error

  # ===================================================================
  # JOB 2: PACKAGE + PUBLISH
  # Downloads the build artifact, packs with Velopack, uploads to GCS.
  # ~2 minutes. Can be re-run independently on packaging failures:
  #   gh run rerun --job <job-id>
  # ===================================================================
  package-publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15

    # This job authenticates to GCP via Workload Identity Federation,
    # which requires id-token: write for the OIDC token exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      # =====================================================================
      # 1. Download the unpacked Electron app from the build job.
      #
      #    download-artifact@v4 with a single named artifact extracts
      #    directly into the `path:` directory (no subdirectory created).
      #    We download to fluxer_desktop/dist-electron/win-unpacked/ so
      #    that working-directory: fluxer_desktop and
      #    --packDir dist-electron/win-unpacked keep working unchanged.
      # =====================================================================
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: electron-win-unpacked
          path: fluxer_desktop/dist-electron/win-unpacked

      # =====================================================================
      # 2. Pack with Velopack
      #    The downloaded artifact recreates dist-electron/win-unpacked/.
      #    Velopack's vpk pack turns this into the release artifacts the
      #    auto-updater expects.
      #
      #    VELOPACK OUTPUT (default channel = "win"):
      #      {packId}-{ver}-full.nupkg       — update package
      #      {packId}-win-Setup.exe           — installer
      #      {packId}-win-Portable.zip        — portable distribution
      #      releases.win.json                — modern feed
      #      assets.win.json                  — build manifest (not uploaded)
      #      RELEASES                         — legacy feed
      #
      #    EXECUTABLE DETECTION:
      #    electron-builder.config.cjs sets productName based on BUILD_CHANNEL
      #    ("Fluxer Canary" for canary, "Fluxer" for stable). The .exe name
      #    follows productName, so we derive the expected name from the channel
      #    and assert it exists. This is safer than scanning for .exe files
      #    because win-unpacked/ can contain other executables (elevate.exe,
      #    game capture helpers under resources/).
      # =====================================================================
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Detect main executable
        id: detect-exe
        working-directory: fluxer_desktop
        run: |
          # Derive the expected executable name from BUILD_CHANNEL.
          # electron-builder.config.cjs: productName = isCanary ? 'Fluxer Canary' : 'Fluxer'
          if ("${{ env.BUILD_CHANNEL }}" -eq "canary") {
            $expectedExe = "Fluxer Canary.exe"
          } else {
            $expectedExe = "Fluxer.exe"
          }

          $exePath = "dist-electron\win-unpacked\$expectedExe"
          if (-not (Test-Path $exePath)) {
            Write-Host "::error::Expected executable not found: $exePath"
            Write-Host "::error::Contents of dist-electron\win-unpacked\:"
            Get-ChildItem "dist-electron\win-unpacked" -Filter "*.exe" | ForEach-Object {
              Write-Host "::error::  $($_.Name)"
            }
            Write-Host "::error::BUILD_CHANNEL=${{ env.BUILD_CHANNEL }}, expected productName-derived exe: $expectedExe"
            exit 1
          }

          Write-Host "Found main executable: $expectedExe"
          echo "MAIN_EXE=$expectedExe" >> $env:GITHUB_OUTPUT

      - name: Pack Velopack release
        working-directory: fluxer_desktop
        run: |
          vpk pack `
            --packId "${{ env.VELOPACK_PACK_ID }}" `
            --packVersion ${{ inputs.build_version }} `
            --packDir dist-electron/win-unpacked `
            --mainExe "${{ steps.detect-exe.outputs.MAIN_EXE }}" `
            --outputDir velopack-release

      # =====================================================================
      # 3. Verify Velopack output
      #    Instead of hardcoding exact filenames (which has broken three times
      #    now), we glob for the expected patterns and assert exactly the
      #    expected count. This way if Velopack changes its naming convention
      #    again, we fail loudly with a useful diagnostic instead of silently
      #    uploading nothing.
      # =====================================================================
      - name: Verify Velopack output
        id: verify
        working-directory: fluxer_desktop
        run: |
          $packId = "${{ env.VELOPACK_PACK_ID }}"
          $version = "${{ inputs.build_version }}"
          $outDir = "velopack-release"

          # --- Verify releases.win.json exists (exact name, channel-dependent) ---
          if (-not (Test-Path "$outDir\releases.win.json")) {
            Write-Host "::error::Missing releases.win.json — the auto-updater feed."
            Write-Host "::error::Actual contents of ${outDir}:"
            Get-ChildItem $outDir | ForEach-Object { Write-Host "::error::  $($_.Name)" }
            exit 1
          }

          # --- Find the installer by glob: {packId}-*Setup.exe ---
          # Velopack embeds the channel in the name (e.g. {packId}-win-Setup.exe).
          # We do NOT hardcode the channel — we glob and assert exactly one match.
          $setupFiles = @(Get-ChildItem "$outDir" -Filter "$packId-*Setup.exe")
          if ($setupFiles.Count -ne 1) {
            Write-Host "::error::Expected exactly 1 file matching '$packId-*Setup.exe', found $($setupFiles.Count)."
            Write-Host "::error::Actual contents of ${outDir}:"
            Get-ChildItem $outDir | ForEach-Object { Write-Host "::error::  $($_.Name)" }
            exit 1
          }
          $setupExe = $setupFiles[0].Name
          Write-Host "Installer: $setupExe"
          echo "SETUP_EXE=$setupExe" >> $env:GITHUB_OUTPUT

          # --- Find the .nupkg by glob: {packId}-{version}-full.nupkg ---
          # The version IS predictable, but we still glob to be safe.
          $nupkgFiles = @(Get-ChildItem "$outDir" -Filter "$packId-*-full.nupkg")
          if ($nupkgFiles.Count -ne 1) {
            Write-Host "::error::Expected exactly 1 file matching '$packId-*-full.nupkg', found $($nupkgFiles.Count)."
            Write-Host "::error::Actual contents of ${outDir}:"
            Get-ChildItem $outDir | ForEach-Object { Write-Host "::error::  $($_.Name)" }
            exit 1
          }
          $nupkg = $nupkgFiles[0].Name
          Write-Host "Package: $nupkg"
          echo "NUPKG=$nupkg" >> $env:GITHUB_OUTPUT

          # --- Find the Portable zip by glob: {packId}-*Portable.zip ---
          $portableFiles = @(Get-ChildItem "$outDir" -Filter "$packId-*Portable.zip")
          if ($portableFiles.Count -eq 1) {
            $portable = $portableFiles[0].Name
            Write-Host "Portable: $portable"
            echo "PORTABLE_ZIP=$portable" >> $env:GITHUB_OUTPUT
          } elseif ($portableFiles.Count -eq 0) {
            Write-Host "No Portable zip found (optional — skipping)"
            echo "PORTABLE_ZIP=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::error::Expected 0 or 1 file matching '$packId-*Portable.zip', found $($portableFiles.Count)."
            exit 1
          }

          Write-Host ""
          Write-Host "Velopack output verified:"
          Get-ChildItem $outDir | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      # =====================================================================
      # 4. Authenticate to GCP via Workload Identity Federation
      #    No service account JSON keys — the GitHub OIDC token is exchanged
      #    for a short-lived GCP access token via the WIF provider.
      # =====================================================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # =====================================================================
      # 5. Upload Velopack release to GCS
      #    Uses the filenames discovered by the verify step — never hardcoded.
      #
      #    Cache policy:
      #    - releases.win.json: no-cache (UpdateManager polls this)
      #    - RELEASES: no-cache (legacy feed)
      #    - .nupkg: immutable (uniquely named per version)
      #    - Setup.exe: no-cache (overwritten each build, first-time installer)
      #    - Portable.zip: no-cache (overwritten each build)
      #
      #    NOT uploaded:
      #    - assets.win.json: build manifest for Velopack deploy commands only,
      #      not needed by the auto-updater or end users.
      # =====================================================================
      - name: Upload Velopack release to GCS
        working-directory: fluxer_desktop
        run: |
          $setupExe = "${{ steps.verify.outputs.SETUP_EXE }}"
          $nupkg = "${{ steps.verify.outputs.NUPKG }}"
          $portableZip = "${{ steps.verify.outputs.PORTABLE_ZIP }}"

          # Upload releases.win.json — the modern feed file that UpdateManager reads.
          gcloud storage cp `
            "velopack-release/releases.win.json" `
            "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/releases.win.json" `
            --cache-control="no-cache"

          # Upload RELEASES file with no-cache (legacy feed for Squirrel migration)
          if (Test-Path "velopack-release/RELEASES") {
            gcloud storage cp `
              "velopack-release/RELEASES" `
              "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/RELEASES" `
              --cache-control="no-cache"
          }

          # Upload .nupkg package with long cache (immutable, uniquely named per version)
          gcloud storage cp `
            "velopack-release/$nupkg" `
            "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/$nupkg" `
            --cache-control="public, max-age=31536000, immutable"

          # Upload installer (discovered name, not hardcoded)
          gcloud storage cp `
            "velopack-release/$setupExe" `
            "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/$setupExe" `
            --cache-control="no-cache"

          # Upload Portable zip if it exists — useful for users who cannot
          # run an installer (e.g. locked-down corporate machines, USB sticks).
          if ($portableZip) {
            gcloud storage cp `
              "velopack-release/$portableZip" `
              "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/$portableZip" `
              --cache-control="no-cache"
          }

      # =====================================================================
      # 6. Attach Velopack installer + Portable zip as workflow artifacts
      #    Available from the GitHub Actions run page for operators who need
      #    to hand the installer to someone without GCS access.
      #
      #    actions/upload-artifact resolves `path` relative to the workspace
      #    root ($GITHUB_WORKSPACE), NOT to working-directory.
      # =====================================================================
      - name: Attach Velopack installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-desktop-installer-${{ inputs.build_version }}
          path: fluxer_desktop/velopack-release/${{ steps.verify.outputs.SETUP_EXE }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach Portable zip as workflow artifact
        if: steps.verify.outputs.PORTABLE_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-desktop-portable-${{ inputs.build_version }}
          path: fluxer_desktop/velopack-release/${{ steps.verify.outputs.PORTABLE_ZIP }}
          if-no-files-found: warn
          retention-days: 30

      # =====================================================================
      # 7. Prune old releases — keep current + previous only
      #
      #     WHY NOT A GCS LIFECYCLE RULE:
      #     Lifecycle rules operate on object age or noncurrent version count.
      #     Neither can express "keep the last two releases" when a release is
      #     a set of files under a prefix. A time-based rule would delete the
      #     CURRENT release if no build runs for N days — breaking every
      #     installed client's updater. Correctness matters more than elegance.
      #
      #     ALGORITHM:
      #     1. List all .nupkg files under the feed prefix.
      #     2. Parse version numbers from filenames.
      #        Velopack names: {packId}-{version}-full.nupkg
      #        The packId can contain underscores, so we anchor on the
      #        version-suffix-extension pattern, not on a simple dash.
      #     3. Sort by version descending.
      #     4. Keep the two most recent versions' files.
      #     5. Delete everything older.
      #     6. Never delete releases.win.json, RELEASES, Setup.exe, or
      #        Portable.zip (always current — overwritten each build).
      #
      #     SAFETY: if there are 2 or fewer versions, nothing is deleted.
      # =====================================================================
      - name: Prune old releases
        run: |
          Write-Host "Listing existing packages in feed..."
          $objects = gcloud storage ls "gs://${{ env.GCS_BUCKET }}/${{ env.FEED_PREFIX }}/" 2>$null

          if (-not $objects) {
            Write-Host "No objects found — nothing to prune"
            exit 0
          }

          # Collect .nupkg files and extract versions.
          # Velopack filenames: {packId}-{version}-{type}.nupkg
          # where version is semver (e.g. 2026.802.120000) and type is "full" or "delta".
          # The packId may contain underscores/hyphens, so we match the version
          # by anchoring on the -full.nupkg or -delta.nupkg suffix.
          $packages = @()
          foreach ($obj in $objects) {
            if ($obj -match '\.nupkg$') {
              if ($obj -match '-(\d+\.\d+\.\d+(?:\.\d+)*)-(full|delta)\.nupkg$') {
                $packages += [PSCustomObject]@{
                  Path = $obj
                  Version = $Matches[1]
                }
              }
            }
          }

          if ($packages.Count -eq 0) {
            Write-Host "No .nupkg packages found — nothing to prune"
            exit 0
          }

          # Get unique versions, sorted descending
          $versions = $packages | Select-Object -ExpandProperty Version -Unique |
            Sort-Object { [version]$_ } -Descending

          Write-Host "Found versions: $($versions -join ', ')"

          if ($versions.Count -le 2) {
            Write-Host "2 or fewer versions — nothing to prune"
            exit 0
          }

          # Versions to delete: everything beyond the 2 most recent
          $toDelete = $versions | Select-Object -Skip 2

          foreach ($ver in $toDelete) {
            $filesToDelete = $packages | Where-Object { $_.Version -eq $ver }
            foreach ($file in $filesToDelete) {
              Write-Host "Deleting: $($file.Path)"
              gcloud storage rm $file.Path
            }
          }

          Write-Host "Pruning complete — kept versions: $($versions[0]), $($versions[1])"
